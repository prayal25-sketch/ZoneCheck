version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/zonecheck
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongo
    networks:
      - zonecheck-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/zonecheck
    depends_on:
      - mongo
    networks:
      - zonecheck-net

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - zonecheck-net

volumes:
  mongo-data:

networks:
  zonecheck-net:
    driver: bridge
